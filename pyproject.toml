[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freecad-tutor-mcp"
version = "0.2.0"
description = "Tutor-focused MCP server and FreeCAD workbench for learning FreeCAD 1.0/1.1+ with Claude Desktop on Windows"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-2.1-or-later"
dependencies = [
    # MCP Python SDK 2.x (uses MCPServer from mcp.server.mcpserver)
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
]

[project.scripts]
freecad-tutor-mcp = "freecad_tutor_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_tutor_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
